# ─────────────────────────────────────────────────────────────
#  PostgreSQL profile  (default)
#  Install PostgreSQL: https://www.postgresql.org/download/
#  Then create the database:
#    psql -U postgres -c "CREATE DATABASE bookworm;"
# ─────────────────────────────────────────────────────────────

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/bookworm
spring.datasource.username=postgres
spring.datasource.password=POSTGRES
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# create-drop  → drop and recreate schema on every restart (dev only)
# update       → only add missing columns/tables
# validate     → fail if schema doesn't match entities
# none         → do nothing (production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Seed data on startup
app.seed-data=true
