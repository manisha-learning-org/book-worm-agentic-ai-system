# ─────────────────────────────────────────────────────────────
#  H2 in-memory profile  – no PostgreSQL required
#  Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# ─────────────────────────────────────────────────────────────

spring.datasource.url=jdbc:h2:mem:bookworm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 browser console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

app.seed-data=true
